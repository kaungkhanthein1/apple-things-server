services:
  postgres:
    image: postgres:15-alpine
    container_name: medusa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chase
      POSTGRES_PASSWORD: kkh@188955
      POSTGRES_DB: medusa-db
    ports:
      - "5432:5432"
    volumes:
      - medusa_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chase -d medusa-db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  medusa_pg_data: